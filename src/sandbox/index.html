<!DOCTYPE html>
<html>
<head>
	<title>Code Sandbox</title>

	<style type="text/css">
		body {
			margin: 1em auto;
			max-width: 80em;
			width: 88%;
		}
	</style>

	<link rel="stylesheet" type="text/css" href="./styles.css">
</head>
<body>

	<h1>Code Sandbox</h1>

	<code-sandbox console hidden>
		<div for="intro"><p>Some message or text...</p></div>
		<textarea for="html" open><h1>Here's some text</h1>
    <p>Here's a paragraph.</p></textarea>
		<textarea for="css">/* ... */</textarea>
		<textarea for="js" open>// ...</textarea>
	</code-sandbox>

	<code-sandbox console="open" hidden>
	<div for="intro"><p>Some message or text...</p></div>
	<textarea for="html"><!-- ... --></textarea>
	<textarea for="css">/* ... */</textarea>
	<textarea for="js" open>// ...</textarea>
	</code-sandbox>

	<code-sandbox result="console" hidden>
	<div for="intro"><p>Some message or text...</p></div>
	<textarea for="html" open>
    </textarea>
	<textarea for="css">/* ... */</textarea>
	<textarea for="js" open>console.log('hi!');</textarea>
	</code-sandbox>

	<code-sandbox console="open" collapse hidden>
	<div for="intro"><summary>Try it out...</summary></div>
	<textarea for="html"><!-- ... --></textarea>
	<textarea for="css">/* ... */</textarea>
	<textarea for="js" open>// ...</textarea>
	</code-sandbox>

    <script src="./prism.js"></script>
	<script type="module" src="./scripts.js"></script>
</body>
</html>
